<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/maplibre/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .maplibregl-ctrl-attrib {
        font: 11px sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="/pmtiles.js"></script>
    <script type="module">
      import {
        Map,
        addProtocol,
        LngLatBounds,
      } from "/maplibre/maplibre-gl.mjs";
      const dark = new URLSearchParams(location.search).get("theme") === "dark";
      const protocol = new pmtiles.Protocol();
      addProtocol("pmtiles", protocol.tile);
      const style = await (
        await fetch(dark ? "style-dark.json" : "style-light.json")
      ).json();
      const response = await (await fetch("route-response.json")).json();
      const route = response.routes[0];
      const coordinates = route.geometry.coordinates;
      const bounds = coordinates.reduce(
        (b, c) => b.extend(c),
        new LngLatBounds(coordinates[0], coordinates[0]),
      );
      window.renderErrors = [];
      const map = new Map({
        container: "map",
        style,
        center: coordinates[0],
        zoom: 13,
        interactive: false,
        attributionControl: { compact: false },
        canvasContextAttributes: { preserveDrawingBuffer: true },
      });
      window.map = map;
      map.on("error", (event) => window.renderErrors.push(String(event.error)));
      map.on("load", () => {
        map.addSource("osol-route", {
          type: "geojson",
          data: { type: "Feature", properties: {}, geometry: route.geometry },
        });
        for (const [id, color, width] of [
          ["osol-route-case", dark ? "#3652B0" : "#203C9C", 8],
          ["osol-route-main", dark ? "#A5BAFF" : "#3155D9", 5],
        ])
          map.addLayer({
            id,
            type: "line",
            source: "osol-route",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": color, "line-width": width },
          });
        const points = [coordinates[0], coordinates.at(-1)];
        map.addSource("route-ends", {
          type: "geojson",
          data: {
            type: "FeatureCollection",
            features: points.map((c, i) => ({
              type: "Feature",
              properties: { label: i ? "송정" : "미포" },
              geometry: { type: "Point", coordinates: c },
            })),
          },
        });
        map.addLayer({
          id: "route-ends",
          type: "circle",
          source: "route-ends",
          paint: {
            "circle-radius": 7,
            "circle-color": dark ? "#A5BAFF" : "#3155D9",
            "circle-stroke-color": dark ? "#0C1220" : "#FFFFFF",
            "circle-stroke-width": 3,
          },
        });
        map.fitBounds(bounds, {
          padding: { top: 90, bottom: 100, left: 72, right: 72 },
          duration: 0,
        });
        map.once("idle", () => {
          window.renderReady = true;
          window.renderDetails = {
            bounds: map.getBounds().toArray(),
            zoom: map.getZoom(),
            points: coordinates.length,
            distance: route.distance_m,
          };
        });
      });
    </script>
  </body>
</html>
